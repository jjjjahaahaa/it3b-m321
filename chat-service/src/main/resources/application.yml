server:
  port: 8080

spring:
  application:
    name: chat-service

  # Verbindung zur Datenbank. Im Compose-Stack setzt docker-compose.yml die Variablen (aus .env).
  # Ohne Variablen gelten die Werte nach dem Doppelpunkt, damit man den Dienst weiterhin aus
  # der IDE gegen einen lokal laufenden PostgreSQL und RabbitMQ starten kann.
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:chat}
    username: ${POSTGRES_USER:chat}
    password: ${POSTGRES_PASSWORD:chat}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_DEFAULT_USER:chat}
    password: ${RABBITMQ_DEFAULT_PASS:chat}

# Swagger UI liegt unter http://localhost:8080/swagger-ui.html
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    # Endpunkte nach Reihenfolge im Controller sortieren statt alphabetisch
    operations-sorter: method

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
      # Schaltet /actuator/health/liveness ein. Es sagt nur "der Dienst lebt" und fragt
      # weder Datenbank noch Broker. Der Compose-Healthcheck nutzt es.
      probes:
        enabled: true

logging:
  level:
    # Im Unterricht wollen wir jeden Schritt sehen.
    ch.benedict.m321: DEBUG
